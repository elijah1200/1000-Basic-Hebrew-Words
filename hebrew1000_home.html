function save(){localStorage.setItem(KEY,JSON.stringify(p));stats()}function stats(){let k=Object.keys(p.known).length,s=Object.keys(p.seen).length;document.getElementById("headStats").textContent=`${k}/${WORDS.length} 覚えた`;["homeKnown","sKnown"].forEach(x=>document.getElementById(x).textContent=k);["homeSeen","sSeen"].forEach(x=>document.getElementById(x).textContent=s);document.getElementById("sNot").textContent=Math.max(0,s-k);document.getElementById("bar").style.width=Math.round(k/WORDS.length*100)+"%";document.getElementById("pct").textContent=`進捗 ${Math.round(k/WORDS.length*100)}%`}
function page(id){document.querySelectorAll("section").forEach(x=>x.classList.remove("show"));document.getElementById(id).classList.add("show");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===id));if(id==="list")renderList();stats();scrollTo(0,0)}
document.querySelectorAll(".nav button").forEach(x=>x.onclick=()=>page(x.dataset.page));
function conjHTML(w){if(!w.conj)return '';let [pr,pa,fu]=w.conj;let rows=[['現在','男性単数',pr[0]],['現在','女性単数',pr[1]],['現在','男性複数',pr[2]],['現在','女性複数',pr[3]],['過去','私',pa[0]],['過去','あなた（男性）',pa[1]],['過去','あなた（女性）',pa[2]],['過去','彼',pa[3]],['過去','彼女',pa[4]],['過去','私たち',pa[5]],['過去','あなたたち（男性）',pa[6]],['過去','あなたたち（女性）',pa[7]],['過去','彼ら・彼女ら',pa[8]],['未来','私',fu[0]],['未来','あなた（男性）',fu[1]],['未来','あなた（女性）',fu[2]],['未来','彼',fu[3]],['未来','彼女',fu[4]],['未来','私たち',fu[5]],['未来','あなたたち',fu[6]],['未来','あなたたち（女性）',fu[7]],['未来','彼ら・彼女ら',fu[8]]];return `<div class="conjbox"><button class="conjbtn" onclick="toggleConj(event,'conj-${w.n}')">活用を見る</button><div id="conj-${w.n}" class="conj hidden"><h3>現在形</h3><div class="conjgrid">${rows.slice(0,4).map(r=>`<div><span>${r[1]}</span><b dir="rtl">${esc(r[2])}</b></div>`).join('')}</div><h3>過去形</h3><div class="conjgrid">${rows.slice(4,13).map(r=>`<div><span>${r[1]}</span><b dir="rtl">${esc(r[2])}</b></div>`).join('')}</div><h3>未来形</h3><div class="conjgrid">${rows.slice(13).map(r=>`<div><span>${r[1]}</span><b dir="rtl">${esc(r[2])}</b></div>`).join('')}</div></div></div>`}
function toggleConj(e,id){e.stopPropagation();document.getElementById(id).classList.toggle('hidden')}
function card(w,target){const id=target+"FlipCard";document.getElementById(target).innerHTML=`<div class="card-wrap"><div id="${id}" class="card ${flip?'flipped':''}" onclick="toggleCard('${id}')"><div class="face"><div><span class="tag">${esc(w.pos)}</span><span class="tag">${w.level}</span></div><div class="he">${esc(w.he)}</div><button class="primary" onclick="showAnswer(event,'${id}')">答えを見る</button></div><div class="face back"><div><span class="tag">${esc(w.pos)}</span><span class="tag">${w.level}</span></div><div class="meaning">${esc(w.jp)}</div>${w.en?`<div class="muted">${esc(w.en.replace(/\([^)]*\)/g,''))}</div>`:''}${w.example?`<div class="example">${esc(w.example)}</div><div>${esc(w.exampleJP)}</div>`:""}${w.use?`<div class="use"><b>使い方</b><br>${esc(w.use)}</div>`:""}${w.conj?conjHTML(w):''}</div></div></div><div class="controls"><button onclick="prev(event)">← 前へ</button><button onclick="next(event)">次へ →</button><button class="bad" onclick="mark(event,false)">まだ</button><button class="good" onclick="mark(event,true)">覚えた</button></div>`}
function toggleCard(id){flip=!flip;document.getElementById(id).classList.toggle("flipped",flip)}function showAnswer(e,id){e.stopPropagation();flip=true;document.getElementById(id).classList.add("flipped")}
function render(){card(deck[i],mode==="random"?"randomCard":"studyCard")}function prev(e){e.stopPropagation();i=(i-1+deck.length)%deck.length;flip=false;render()}function next(e){e.stopPropagation();i=(i+1)%deck.length;flip=false;render()}function mark(e,k){e.stopPropagation();let w=deck[i];p.seen[w.n]=1;k?p.known[w.n]=1:delete p.known[w.n];save();next(e)}
function startStudy(){mode="study";deck=WORDS.filter(w=>!p.known[w.n]);if(!deck.length)deck=[...WORDS];i=0;flip=false;document.getElementById("studyInfo").textContent=`${deck.length}語を学習対象にしています。`;page("study");render()}
function startRandom(){mode="random";deck=[...WORDS];i=Math.floor(Math.random()*deck.length);flip=false;page("random");render()}
const POS=["すべて","名詞","動詞","形容詞","副詞","前置詞","代名詞","接続詞","間投詞","助詞・小辞","限定詞","数詞","表現"];document.getElementById("filters").innerHTML=POS.map(x=>`<button onclick="setFilter('${x}')" class="${x==="すべて"?"on":""}">${x}</button>`).join("");function setFilter(x){filter=x;document.querySelectorAll("#filters button").forEach(b=>b.classList.toggle("on",b.textContent===x));renderList()}document.getElementById("search").oninput=renderList;
function renderList(){let q=document.getElementById("search").value.toLowerCase(),a=WORDS.filter(w=>(filter==="すべて"||w.pos===filter)&&[w.he,w.jp,w.en].some(v=>String(v).toLowerCase().includes(q)));document.getElementById("count").textContent=`${a.length}語を表示`;document.getElementById("tbody").innerHTML=a.map(w=>`<tr><td>${w.n}</td><td class="cellhe">${esc(w.he)}</td><td>${esc(w.jp)}</td><td>${esc(w.en.replace(/\([^)]*\)/g,''))}</td><td>${esc(w.pos)}</td><td>${w.level}</td></tr>`).join("")}
function resetProgress(){if(confirm("学習状況をすべてリセットしますか？")){p={known:{},seen:{}};save()}}
stats();renderList();</script></body></html>
